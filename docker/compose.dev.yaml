# docker compose file that can be used for development - do not use this in production!
#
# Modifications done:
# - directly provides most of the environment variables in the file, not
#   caring to protect potentially sensitive ones
# - exposes some unneeded ports to the host system, which is useful for
#   dev, testing and debugging
# - mounts code repository inside the relevant container as a bind volume

name: seis-lab-data

x-common-image: &common-image "ghcr.io/naturalgis/seis-lab-data/seis-lab-data:${CURRENT_GIT_BRANCH:-latest}"
x-auth-image: &auth-image "ghcr.io/goauthentik/server:2026.8.5"
x-auth-admin-token: &auth-admin-token "admin123"
x-db-image: &db-image "postgis/postgis:17-3.5"
x-auth-client-id: &auth-client-id "sld-client-id"
x-auth-client-secret: &auth-client-secret "sld-client-secret"
x-auth-redirect-url: &auth-redirect-url "http://localhost:8888/oauth2/callback"
# GeoNode service account and OAuth2 app used for exporting records - these
# must be created in GeoNode, as described in the development docs
x-geonode-export-username: &geonode-export-username "sld-bot"
x-geonode-export-password: &geonode-export-password "12345678"
x-geonode-export-client-id: &geonode-export-client-id "sld"
x-geonode-export-client-secret: &geonode-export-client-secret "sld-secret"

x-common-env: &common-env
  SEIS_LAB_DATA__AUTH_ADMIN_TOKEN: *auth-admin-token
  SEIS_LAB_DATA__AUTH_INTERNAL_BASE_URL: http://auth-webapp:9000
  SEIS_LAB_DATA__DEBUG: true
  SEIS_LAB_DATA__DATABASE_DSN: postgresql+psycopg://sld:sldpass@db:5432/seis_lab_data
  SEIS_LAB_DATA__LOG_CONFIG_FILE: /home/ubuntu/app/dev-log-config.yml
  SEIS_LAB_DATA__MESSAGE_BROKER_DSN: redis://message-broker:6379
  SEIS_LAB_DATA__TEST_DATABASE_DSN: postgresql+psycopg://sld:sldpass@test-db:5432/seis_lab_data_test
  SEIS_LAB_DATA__READONLY_ARCHIVE_ROOT_DIRECTORY: /data/production_archive
  SEIS_LAB_DATA__PUBLIC_URL: http://localhost:8888
  SEIS_LAB_DATA__TARGET_GEONODE__URL: http://django:8000
  SEIS_LAB_DATA__TARGET_GEONODE__PUBLIC_URL: http://geonode.localhost:8888
  SEIS_LAB_DATA__TARGET_GEONODE__USERNAME: *geonode-export-username
  SEIS_LAB_DATA__TARGET_GEONODE__PASSWORD: *geonode-export-password
  SEIS_LAB_DATA__TARGET_GEONODE__CLIENT_ID: *geonode-export-client-id
  SEIS_LAB_DATA__TARGET_GEONODE__CLIENT_SECRET: *geonode-export-client-secret

x-common-auth-env: &common-auth-env
  AUTHENTIK_LOG_LEVEL: debug
  AUTHENTIK_SECRET_KEY: mysecret
  AUTHENTIK_REDIS__HOST: message-broker
  AUTHENTIK_POSTGRESQL__HOST: auth-db
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: authentik_pass
  SEIS_LAB_DATA_AUTHENTIK_BASE_URL: http://auth.localhost:8888/
  AUTHENTIK_WEB__BASE_URL: http://auth.localhost:8888
  SEIS_LAB_DATA_CLIENT_ID: *auth-client-id
  SEIS_LAB_DATA_CLIENT_SECRET: *auth-client-secret
  SEIS_LAB_DATA_REDIRECT_URI: *auth-redirect-url
  SEIS_LAB_DATA_POST_LOGOUT_REDIRECT_URI: http://localhost:8888/

x-geonode-env-file: &geonode-env-file ./geonode/geonode-dev.env

x-geonode-common: &geonode-common
  image: geonode/geonode:5.1.1
  profiles: ["geonode"]
  env_file: *geonode-env-file
  entrypoint: ["/usr/src/geonode/entrypoint.sh"]
  volumes:
    - geonode-statics:/mnt/volumes/statics
    - geonode-geoserver-data:/geoserver_data/data
    - geonode-backup-restore:/backup_restore
    - geonode-data:/data
    - geonode-tmp:/tmp
  depends_on:
    geonode-db:
      condition: service_healthy
    message-broker:
      condition: service_healthy

x-common-volumes: &common-volumes
  - type: bind
    source: ../src
    target: /home/ubuntu/app/src
  - type: bind
    source: ../pyproject.toml
    target: /home/ubuntu/app/pyproject.toml
  - type: bind
    source: ../tests
    target: /home/ubuntu/app/tests
  - type: bind
    source: ../dev-log-config.yml
    target: /home/ubuntu/app/dev-log-config.yml
  - type: bind
    source: ../sample-data
    target: /data

services:

  web-gateway:
    image: traefik:v3
    ports:
      - target: 80
        published: 8888
      # traefik API and dashboard
      - target: 8080
        published: 8887
    configs:
      - source: traefik-conf
        target: /traefik.toml
    command: --configFile /traefik.toml
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock

  auth-db:
    image: postgres:17
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik_pass
    healthcheck:
      test: "pg_isready -d authentik -U authentik"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - authentik_db:/var/lib/postgresql/data

  auth-webapp:
    image: *auth-image
    command: server
    environment:
      <<: *common-auth-env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-router.rule=Host(`auth.localhost`)"
      - "traefik.http.routers.auth-router.entrypoints=web"
      - "traefik.http.routers.auth-router.priority=100"
      - "traefik.http.services.auth-service.loadbalancer.server.port=9000"
    depends_on:
      auth-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:9000/-/health/ready/\").raise_for_status()'"]
      start_period: 30s
      interval: 10s
      retries: 10
      timeout: 5s

  auth-worker:
    image: *auth-image
    command: worker
    environment:
      <<: *common-auth-env
      # run blueprint applies one at a time - with concurrent worker threads, the
      # blueprints applied on first boot can deadlock each other in the DB and authentik
      # does not retry them, leaving the seis-lab-data application missing
      AUTHENTIK_WORKER__THREADS: 1
      AUTHENTIK_BOOTSTRAP_PASSWORD: admin123
      AUTHENTIK_BOOTSTRAP_TOKEN: *auth-admin-token
      AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@email.com
    volumes:
      - type: bind
        source: ./authentik/sld-auth-blueprint-dev.yaml
        target: /blueprints/custom/sld-auth-blueprint-dev.yaml
        read_only: true
    depends_on:
      auth-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      # Hits the unauthenticated OIDC discovery endpoint for our application. It only
      # starts returning 200 once the custom blueprint (which creates the seis-lab-data
      # OAuth2 provider/application) has actually been applied by the worker - unlike
      # checking for the akadmin user, which exists long before the custom blueprint runs.
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://auth-webapp:9000/application/o/seis-lab-data/.well-known/openid-configuration\").raise_for_status()'"]
      start_period: 30s
      interval: 10s
      retries: 15
      timeout: 5s

  message-broker:
    image: redis:8
    ports:
      - target: 6379
        published: 6379
    healthcheck:
      test: "redis-cli PING | grep PONG"

  db:
    image: *db-image
    # the Debian postgis image has no arm64 build - run it emulated on Apple Silicon
    platform: linux/amd64
    environment:
      POSTGRES_DB: seis_lab_data
      POSTGRES_USER: sld
      POSTGRES_PASSWORD: sldpass
    healthcheck:
      test: "pg_isready -d seis_lab_data -U sld"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    ports:
      - target: 5432
        published: 55432
    volumes:
      - db:/var/lib/postgresql/data

  webapp:
    image: *common-image
    environment:
      <<: *common-env
      SEIS_LAB_DATA__BIND_HOST: 0.0.0.0
      SEIS_LAB_DATA__BIND_PORT: 5000
      SEIS_LAB_DATA__PUBLIC_URL: http://localhost:8888
      SEIS_LAB_DATA__DOCS_URL: http://docs.localhost:8888
      SEIS_LAB_DATA__AUTH_EXTERNAL_BASE_URL: http://auth.localhost:8888
      SEIS_LAB_DATA__AUTH_INTERNAL_BASE_URL: http://auth-webapp:9000
      SEIS_LAB_DATA__AUTH_CLIENT_ID: *auth-client-id
      SEIS_LAB_DATA__AUTH_CLIENT_SECRET: *auth-client-secret
      SEIS_LAB_DATA__WEBMAP_BASE_TILE_LAYER_URL: http://localhost:8888/tiles/emodnet-bathymetry/{z}/{x}/{y}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sld-router.rule=PathRegexp(`^/`)"
      - "traefik.http.routers.sld-router.entrypoints=web"
      - "traefik.http.routers.sld-router.priority=10"
      - "traefik.http.services.sld-service.loadbalancer.server.port=5000"
    depends_on:
      db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      auth-webapp:
        condition: service_healthy
      auth-worker:
        condition: service_healthy
    volumes:
      *common-volumes

  interactive-worker:
    image: *common-image
    command:
      - "run-worker"
      - "--queue"
      - "default"
    environment:
      <<: *common-env
    volumes:
      *common-volumes

  long-tasks-worker:
    image: *common-image
    command:
      - "run-worker"
      - "--queue"
      - "previews"
      - "--queue"
      - "thumbnails"
      - "--queue"
      - "exports"
    environment:
      <<: *common-env
      SEIS_LAB_DATA__THUMBNAIL_BASE_TILE_LAYER_URL: http://martin-tile-server:3000/emodnet-bathymetry/{z}/{x}/{y}
    volumes:
      *common-volumes

  discovery-worker:
    image: *common-image
    command:
      - "run-worker"
      # one process discovers one mission at a time; set DISCOVERY_WORKER_PROCESSES
      # to discover several missions in parallel
      - "--processes"
      - "${DISCOVERY_WORKER_PROCESSES:-1}"
      - "--threads"
      - "1"
      - "--queue"
      - "discovery"
    environment:
      <<: *common-env
      # number of files whose metadata discovery reads at the same time, each in a
      # worker process of its own (default: 4); raised because reads from a
      # network-mounted archive (e.g. sshfs) are slow, and concurrent reads overlap
      # their waiting time
      SEIS_LAB_DATA__DISCOVERY_EXTRACTION_CONCURRENCY: 8
    volumes:
      *common-volumes

  martin-tile-server:
    image: ghcr.io/maplibre/martin:martin-v0.19.3
    command: ["--config", "/martin-conf"]
    environment:
      RUST_LOG: debug
      SLD_DATABASE_URL: postgres://sld:sldpass@db/seis_lab_data
    configs:
      - martin-conf
    volumes:
      - type: bind
        source: ../sample-data/pmtiles
        target: /pmtiles
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.martin-stripprefix.stripprefix.prefixes=/tiles"
      - "traefik.http.routers.martin-router.entrypoints=web"
      - "traefik.http.routers.martin-router.rule=PathPrefix(`/tiles`)"
      - "traefik.http.routers.martin-router.priority=90"
      - "traefik.http.routers.martin-router.middlewares=martin-stripprefix"
      - "traefik.http.services.martin.loadbalancer.server.port=3000"

  jupyter:
    image: *common-image
    environment:
      *common-env
    ports:
      - target: 5002
        published: 5002
    volumes:
      *common-volumes
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        uv sync --group jupyter
        uv run jupyter lab --ip=0.0.0.0 --port=5002 --no-browser --LabApp.token= --LabApp.password=

  test-db:
    image: *db-image
    # the Debian postgis image has no arm64 build - run it emulated on Apple Silicon
    platform: linux/amd64
    environment:
      POSTGRES_DB: seis_lab_data_test
      POSTGRES_USER: sld
      POSTGRES_PASSWORD: sldpass
    healthcheck:
      test: "pg_isready -d seis_lab_data_test -U sld"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    ports:
      - target: 5432
        published: 55433
    volumes:
      - test-db:/var/lib/postgresql/data

  dozzle:
    image: amir20/dozzle:v10
    environment:
      DOZZLE_BASE: /monitoring
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle-router.rule=PathPrefix(`/monitoring`)"
      - "traefik.http.routers.dozzle-router.entrypoints=web"
      - "traefik.http.routers.dozzle-router.priority=95"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

  pg_admin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@dev.dev
      PGADMIN_DEFAULT_PASSWORD: dev
      PGADMIN_LISTEN_ADDRESS: "0.0.0.0"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_SERVER_JSON_FILE: /pgadmin-servers-conf
      PGPASSFILE: /pgadmin-pgpass-file
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin-router.rule=Host(`pgadmin.localhost`)"
      - "traefik.http.routers.pgadmin-router.entrypoints=web"
      - "traefik.http.routers.pgadmin-router.priority=90"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
    configs:
      - pgadmin-servers-conf
      - source: pgadmin-pgpass-file
        mode: 0600
        uid: "5050"
        gid: "5050"

  docs:
    image: *common-image
    entrypoint: ["uv", "run", "mkdocs"]
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    environment:
      DOCS_DEBUG: "true"
    volumes:
      - type: bind
        source: ../mkdocs.yml
        target: /home/ubuntu/app/mkdocs.yml
      - type: bind
        source: ../docs
        target: /home/ubuntu/app/docs
      - type: bind
        source: ../mkdocs
        target: /home/ubuntu/app/mkdocs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs-router.entrypoints=web"
      - "traefik.http.routers.docs-router.rule=Host(`docs.localhost`)"
      - "traefik.http.routers.docs-router.priority=90"
      - "traefik.http.services.docs.loadbalancer.server.port=8000"

  # GeoNode services - these are adapted from the upstream GeoNode v5.1.1 compose file:
  #
  # https://github.com/GeoNode/geonode/blob/5.1.1/docker-compose.yml
  #
  # They are only started when the `geonode` profile is active, e.g.:
  #
  #   docker compose -f docker/compose.dev.yaml --profile geonode up -d
  #
  # GeoNode is reachable at http://geonode.localhost:8888 (and GeoServer at
  # http://geonode.localhost:8888/geoserver/). Other services in the stack can reach the
  # GeoNode API directly at http://django:8000
  #
  # The upstream GeoNode images expect some fixed hostnames (`geonode`, `django`, `geoserver`),
  # which are provided as network aliases

  geonode-db:
    image: geonode/postgis:15-3.5-latest
    profiles: ["geonode"]
    command: postgres -c "max_connections=200"
    env_file: *geonode-env-file
    healthcheck:
      test: "pg_isready -d postgres -U postgres"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - geonode-db:/var/lib/postgresql/data

  geonode-django:
    <<: *geonode-common
    environment:
      IS_CELERY: "False"
      SLD_BOT_USERNAME: *geonode-export-username
      SLD_BOT_PASSWORD: *geonode-export-password
      SLD_OAUTH_APP_NAME: "seis-lab-data"
      SLD_OAUTH_APP_CLIENT_ID: *geonode-export-client-id
      SLD_OAUTH_APP_CLIENT_SECRET: *geonode-export-client-secret
    # uwsgi with fewer workers than the upstream defaults - note that uwsgi request logs
    # go to /var/log/geonode.log inside the container
    command:
      - "uwsgi"
      - "--ini"
      - "/usr/src/geonode/uwsgi.ini"
      - "--processes"
      - "4"
      - "--cheaper"
      - "1"
      - "--cheaper-initial"
      - "2"
      - "--cheaper-step"
      - "1"
    networks:
      default:
        aliases:
          - django
    healthcheck:
      test: "curl -m 10 --fail --silent --output /dev/null http://django:8000/"
      # the first boot runs migrations, loads fixtures and collects static files
      start_period: 300s
      start_interval: 10s
      interval: 60s
      timeout: 10s
      retries: 3

  geonode-celery:
    <<: *geonode-common
    environment:
      IS_CELERY: "True"
    command: "celery-cmd"
    depends_on:
      geonode-django:
        condition: service_healthy

  geonode-nginx:
    image: geonode/nginx:1.31.7-latest
    profiles: ["geonode"]
    env_file: *geonode-env-file
    networks:
      default:
        aliases:
          - geonode
    volumes:
      - geonode-statics:/mnt/volumes/statics
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geonode-router.rule=Host(`geonode.localhost`)"
      - "traefik.http.routers.geonode-router.entrypoints=web"
      - "traefik.http.routers.geonode-router.priority=100"
      - "traefik.http.services.geonode.loadbalancer.server.port=80"

  geonode-geoserver:
    image: geonode/geoserver:2.28.6-latest
    profiles: ["geonode"]
    env_file: *geonode-env-file
    networks:
      default:
        aliases:
          - geoserver
    healthcheck:
      test: "curl -m 10 --fail --silent --output /dev/null http://localhost:8080/geoserver/ows"
      start_period: 120s
      start_interval: 10s
      interval: 60s
      timeout: 10s
      retries: 3
    volumes:
      - geonode-statics:/mnt/volumes/statics
      - geonode-geoserver-data:/geoserver_data/data
      - geonode-backup-restore:/backup_restore
      - geonode-data:/data
      - geonode-tmp:/tmp
    depends_on:
      geonode-geoserver-data:
        condition: service_healthy
      geonode-django:
        condition: service_healthy

  # seeds the GeoServer data directory volume
  geonode-geoserver-data:
    image: geonode/geoserver_data:2.28.6-latest
    profiles: ["geonode"]
    entrypoint: sleep infinity
    volumes:
      - geonode-geoserver-data:/geoserver_data/data
    healthcheck:
      test: "ls -A '/geoserver_data/data' | wc -l"


configs:

  traefik-conf:
    file: ./traefik/dev-config.toml

  martin-conf:
    content: |
      base_path: /tiles
      listen_addresses: '0.0.0.0:3000'
      web_ui: disable
      cache_size_mb: 0
      postgres:
        connection_string: $${SLD_DATABASE_URL}
        auto_publish: false

        tables:

          projects:
            schema: public
            table: project
            srid: 4326
            geometry_column: bbox_4326
            id_column: ~
            geometry_type: POLYGON
            buffer: 256
            properties:
              id: uuid
              name: jsonb

          survey_missions:
            schema: public
            table: surveymission
            srid: 4326
            geometry_column: bbox_4326
            id_column: ~
            geometry_type: POLYGON
            buffer: 256
            properties:
              id: uuid
              name: jsonb

          survey_related_records:
            schema: public
            table: surveyrelatedrecord
            srid: 4326
            geometry_column: bbox_4326
            id_column: ~
            geometry_type: POLYGON
            buffer: 256
            properties:
              id: uuid
              name: jsonb

      pmtiles:
        paths:
          - /pmtiles

  pgadmin-servers-conf:
    content: |
      {
        "Servers": {
          "sld-db": {
            "Name": "seis-lab-data dev database",
            "Group": "Servers",
            "Port": 5432,
            "Username": "sld",
            "Host": "db",
            "MaintenanceDB": "postgres",
            "ConnectionParameters": {
              "sslmode": "prefer",
              "connect_timeout": 10,
              "passfile": "/pgadmin-pgpass-file"
            }
          },
          "test-db": {
            "Name": "seis-lab-data dev testing database",
            "Group": "Servers",
            "Port": 5432,
            "Username": "sld",
            "Host": "test-db",
            "MaintenanceDB": "postgres",
            "ConnectionParameters": {
              "sslmode": "prefer",
              "connect_timeout": 10,
              "passfile": "/pgadmin-pgpass-file"
            }
          },
          "authentik-db": {
            "Name": "Authentik database",
            "Group": "Servers",
            "Port": 5432,
            "Username": "authentik",
            "Host": "auth-db",
            "MaintenanceDB": "postgres",
            "ConnectionParameters": {
              "sslmode": "prefer",
              "connect_timeout": 10,
              "passfile": "/pgadmin-pgpass-file"
            }
          }
        }
      }

  pgadmin-pgpass-file:
    content: |
      db:5432:*:sld:sldpass
      test-db:5432:*:sld:sldpass
      auth-db:5432:*:authentik:authentik_pass


volumes:
  authentik_db:
  db:
  test-db:
  geonode-db:
  geonode-statics:
  geonode-geoserver-data:
  geonode-backup-restore:
  geonode-data:
  geonode-tmp:
