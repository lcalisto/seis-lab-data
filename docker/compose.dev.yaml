# docker compose file that can be used for development - do not use this in production!
#
# Modifications done:
# - directly provides most of the environment variables in the file, not
#   caring to protect potentially sensitive ones
# - exposes some unneeded ports to the host system, which is useful for
#   dev, testing and debugging
# - mounts code repository inside the relevant container as a bind volume

name: seis-lab-data

x-common-image: &common-image "ghcr.io/naturalgis/seis-lab-data/seis-lab-data:${CURRENT_GIT_BRANCH:-latest}"
x-auth-image: &auth-image "ghcr.io/goauthentik/server:2026.2.1"
x-auth-admin-token: &auth-admin-token "admin123"
x-db-image: &db-image "postgis/postgis:17-3.5"
x-auth-client-id: &auth-client-id "sld-client-id"
x-auth-client-secret: &auth-client-secret "sld-client-secret"
x-auth-redirect-url: &auth-redirect-url "http://localhost:8888/oauth2/callback"

x-common-env: &common-env
  SEIS_LAB_DATA__AUTH_ADMIN_TOKEN: *auth-admin-token
  SEIS_LAB_DATA__AUTH_INTERNAL_BASE_URL: http://auth-webapp:9000
  SEIS_LAB_DATA__DEBUG: true
  SEIS_LAB_DATA__DATABASE_DSN: postgresql+psycopg://sld:sldpass@db:5432/seis_lab_data
  SEIS_LAB_DATA__LOG_CONFIG_FILE: /home/ubuntu/app/dev-log-config.yml
  SEIS_LAB_DATA__MESSAGE_BROKER_DSN: redis://message-broker:6379
  SEIS_LAB_DATA__TEST_DATABASE_DSN: postgresql+psycopg://sld:sldpass@test-db:5432/seis_lab_data_test
  SEIS_LAB_DATA__READONLY_ARCHIVE_ROOT_DIRECTORY: /data/production_archive

x-common-auth-env: &common-auth-env
  AUTHENTIK_LOG_LEVEL: debug
  AUTHENTIK_SECRET_KEY: mysecret
  AUTHENTIK_REDIS__HOST: message-broker
  AUTHENTIK_POSTGRESQL__HOST: auth-db
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: authentik_pass
  SEIS_LAB_DATA_AUTHENTIK_BASE_URL: http://auth.localhost:8888/
  SEIS_LAB_DATA_CLIENT_ID: *auth-client-id
  SEIS_LAB_DATA_CLIENT_SECRET: *auth-client-secret
  SEIS_LAB_DATA_REDIRECT_URI: *auth-redirect-url
  SEIS_LAB_DATA_POST_LOGOUT_REDIRECT_URI: http://localhost:8888/

x-common-volumes: &common-volumes
  - type: bind
    source: ../src
    target: /home/ubuntu/app/src
  - type: bind
    source: ../config
    target: /home/ubuntu/app/config
  - type: bind
    source: ../pyproject.toml
    target: /home/ubuntu/app/pyproject.toml
  - type: bind
    source: ../tests
    target: /home/ubuntu/app/tests
  - type: bind
    source: ../dev-log-config.yml
    target: /home/ubuntu/app/dev-log-config.yml
  - type: bind
    source: ../sample-data
    target: /data

services:

  web-gateway:
    image: traefik:v3
    ports:
      - target: 80
        published: 8888
      # traefik API and dashboard
      - target: 8080
        published: 8887
    configs:
      - source: traefik-conf
        target: /traefik.toml
    command: --configFile /traefik.toml
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock

  auth-db:
    image: postgres:17
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik_pass
    healthcheck:
      test: "pg_isready -d authentik -U authentik"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - authentik_db:/var/lib/postgresql/data

  auth-webapp:
    image: *auth-image
    command: server
    environment:
      <<: *common-auth-env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-router.rule=Host(`auth.localhost`)"
      - "traefik.http.routers.auth-router.entrypoints=web"
      - "traefik.http.routers.auth-router.priority=100"
      - "traefik.http.services.auth-service.loadbalancer.server.port=9000"
    depends_on:
      auth-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:9000/-/health/ready/\").raise_for_status()'"]
      start_period: 30s
      interval: 10s
      retries: 10
      timeout: 5s

  auth-worker:
    image: *auth-image
    command: worker
    environment:
      <<: *common-auth-env
      AUTHENTIK_BOOTSTRAP_PASSWORD: admin123
      AUTHENTIK_BOOTSTRAP_TOKEN: *auth-admin-token
      AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@email.com
      ARCHIVE_BASE_URL: http://sld-archive.localhost:8888
    volumes:
      - type: bind
        source: ./authentik/sld-auth-blueprint-dev.yaml
        target: /blueprints/custom/sld-auth-blueprint-dev.yaml
        read_only: true
    depends_on:
      auth-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      # Hits the unauthenticated OIDC discovery endpoint for our application. It only
      # starts returning 200 once the custom blueprint (which creates the seis-lab-data
      # OAuth2 provider/application) has actually been applied by the worker - unlike
      # checking for the akadmin user, which exists long before the custom blueprint runs.
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://auth-webapp:9000/application/o/seis-lab-data/.well-known/openid-configuration\").raise_for_status()'"]
      start_period: 30s
      interval: 10s
      retries: 15
      timeout: 5s

  message-broker:
    image: redis:8
    ports:
      - target: 6379
        published: 6379
    healthcheck:
      test: "redis-cli PING | grep PONG"

  db:
    image: *db-image
    # the Debian postgis image has no arm64 build - run it emulated on Apple Silicon
    platform: linux/amd64
    environment:
      POSTGRES_DB: seis_lab_data
      POSTGRES_USER: sld
      POSTGRES_PASSWORD: sldpass
    healthcheck:
      test: "pg_isready -d seis_lab_data -U sld"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    ports:
      - target: 5432
        published: 55432
    volumes:
      - db:/var/lib/postgresql/data

  webapp:
    image: *common-image
    environment:
      <<: *common-env
      SEIS_LAB_DATA__BIND_HOST: 0.0.0.0
      SEIS_LAB_DATA__BIND_PORT: 5000
      SEIS_LAB_DATA__PUBLIC_URL: http://localhost:8888
      SEIS_LAB_DATA__DOCS_URL: http://docs.localhost:8888
      SEIS_LAB_DATA__AUTH_EXTERNAL_BASE_URL: http://auth.localhost:8888
      SEIS_LAB_DATA__AUTH_INTERNAL_BASE_URL: http://auth-webapp:9000
      SEIS_LAB_DATA__AUTH_CLIENT_ID: *auth-client-id
      SEIS_LAB_DATA__AUTH_CLIENT_SECRET: *auth-client-secret
      SEIS_LAB_DATA__WEBMAP_BASE_TILE_LAYER_URL: http://localhost:8888/tiles/emodnet-bathymetry/{z}/{x}/{y}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sld-router.rule=PathRegexp(`^/`)"
      - "traefik.http.routers.sld-router.entrypoints=web"
      - "traefik.http.routers.sld-router.priority=10"
      - "traefik.http.services.sld-service.loadbalancer.server.port=5000"
    depends_on:
      db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      auth-webapp:
        condition: service_healthy
      auth-worker:
        condition: service_healthy
    volumes:
      *common-volumes

  processing-worker:
    image: *common-image
    command:
      - "run-processing-worker"
      - "--queues"
      - "default"
    environment:
      <<: *common-env
    volumes:
      *common-volumes

  previews-worker:
    image: *common-image
    command:
      - "run-processing-worker"
      - "--queues"
      - "previews"
    environment:
      <<: *common-env
    volumes:
      *common-volumes

  martin-tile-server:
    image: ghcr.io/maplibre/martin:martin-v0.19.3
    command: ["--config", "/martin-conf"]
    environment:
      RUST_LOG: debug
      SLD_DATABASE_URL: postgres://sld:sldpass@db/seis_lab_data
    configs:
      - martin-conf
    volumes:
      - type: bind
        source: ../sample-data/pmtiles
        target: /pmtiles
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.martin-stripprefix.stripprefix.prefixes=/tiles"
      - "traefik.http.routers.martin-router.entrypoints=web"
      - "traefik.http.routers.martin-router.rule=PathPrefix(`/tiles`)"
      - "traefik.http.routers.martin-router.priority=90"
      - "traefik.http.routers.martin-router.middlewares=martin-stripprefix"
      - "traefik.http.services.martin.loadbalancer.server.port=3000"

  caddy-file-server:
    image: caddy:2
    volumes:
      - type: bind
        source: ./caddy
        target: /etc/caddy
        read_only: true
      - type: bind
        source: ../sample-data
        target: /srv/archive
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.authentik-auth.forwardauth.address=http://auth-webapp:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authentik-auth.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
      - "traefik.http.middlewares.authentik-auth.forwardauth.maxBodySize=1048576"
      - "traefik.http.routers.caddy-router.rule=Host(`sld-archive.localhost`)"
      - "traefik.http.routers.caddy-router.entrypoints=web"
      - "traefik.http.routers.caddy-router.middlewares=authentik-auth"
      - "traefik.http.services.caddy-service.loadbalancer.server.port=8000"

  jupyter:
    image: *common-image
    environment:
      *common-env
    ports:
      - target: 5002
        published: 5002
    volumes:
      *common-volumes
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        uv sync --group jupyter
        uv run jupyter lab --ip=0.0.0.0 --port=5002 --no-browser --LabApp.token= --LabApp.password=

  test-db:
    image: *db-image
    # the Debian postgis image has no arm64 build - run it emulated on Apple Silicon
    platform: linux/amd64
    environment:
      POSTGRES_DB: seis_lab_data_test
      POSTGRES_USER: sld
      POSTGRES_PASSWORD: sldpass
    healthcheck:
      test: "pg_isready -d seis_lab_data_test -U sld"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    ports:
      - target: 5432
        published: 55433
    volumes:
      - test-db:/var/lib/postgresql/data

  dozzle:
    image: amir20/dozzle:v10
    environment:
      DOZZLE_BASE: /monitoring
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle-router.rule=PathPrefix(`/monitoring`)"
      - "traefik.http.routers.dozzle-router.entrypoints=web"
      - "traefik.http.routers.dozzle-router.priority=95"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

  pg_admin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@dev.dev
      PGADMIN_DEFAULT_PASSWORD: dev
      PGADMIN_LISTEN_ADDRESS: "0.0.0.0"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_SERVER_JSON_FILE: /pgadmin-servers-conf
      PGPASSFILE: /pgadmin-pgpass-file
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin-router.rule=Host(`pgadmin.localhost`)"
      - "traefik.http.routers.pgadmin-router.entrypoints=web"
      - "traefik.http.routers.pgadmin-router.priority=90"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
    configs:
      - pgadmin-servers-conf
      - source: pgadmin-pgpass-file
        mode: 0600
        uid: "5050"
        gid: "5050"

  docs:
    image: *common-image
    entrypoint: ["uv", "run", "mkdocs"]
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    environment:
      DOCS_DEBUG: "true"
    volumes:
      - type: bind
        source: ../mkdocs.yml
        target: /home/ubuntu/app/mkdocs.yml
      - type: bind
        source: ../docs
        target: /home/ubuntu/app/docs
      - type: bind
        source: ../mkdocs
        target: /home/ubuntu/app/mkdocs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs-router.entrypoints=web"
      - "traefik.http.routers.docs-router.rule=Host(`docs.localhost`)"
      - "traefik.http.routers.docs-router.priority=90"
      - "traefik.http.services.docs.loadbalancer.server.port=8000"


configs:

  traefik-conf:
    file: ./traefik/dev-config.toml

  martin-conf:
    content: |
      base_path: /tiles
      listen_addresses: '0.0.0.0:3000'
      web_ui: disable
      cache_size_mb: 0
      postgres:
        connection_string: $${SLD_DATABASE_URL}
        auto_publish: false

        tables:

          projects:
            schema: public
            table: project
            srid: 4326
            geometry_column: bbox_4326
            id_column: ~
            geometry_type: POLYGON
            buffer: 256
            properties:
              id: uuid
              name: jsonb

          survey_missions:
            schema: public
            table: surveymission
            srid: 4326
            geometry_column: bbox_4326
            id_column: ~
            geometry_type: POLYGON
            buffer: 256
            properties:
              id: uuid
              name: jsonb

          survey_related_records:
            schema: public
            table: surveyrelatedrecord
            srid: 4326
            geometry_column: bbox_4326
            id_column: ~
            geometry_type: POLYGON
            buffer: 256
            properties:
              id: uuid
              name: jsonb

      pmtiles:
        paths:
          - /pmtiles

  pgadmin-servers-conf:
    content: |
      {
        "Servers": {
          "sld-db": {
            "Name": "seis-lab-data dev database",
            "Group": "Servers",
            "Port": 5432,
            "Username": "sld",
            "Host": "db",
            "MaintenanceDB": "postgres",
            "ConnectionParameters": {
              "sslmode": "prefer",
              "connect_timeout": 10,
              "passfile": "/pgadmin-pgpass-file"
            }
          },
          "test-db": {
            "Name": "seis-lab-data dev testing database",
            "Group": "Servers",
            "Port": 5432,
            "Username": "sld",
            "Host": "test-db",
            "MaintenanceDB": "postgres",
            "ConnectionParameters": {
              "sslmode": "prefer",
              "connect_timeout": 10,
              "passfile": "/pgadmin-pgpass-file"
            }
          },
          "authentik-db": {
            "Name": "Authentik database",
            "Group": "Servers",
            "Port": 5432,
            "Username": "authentik",
            "Host": "auth-db",
            "MaintenanceDB": "postgres",
            "ConnectionParameters": {
              "sslmode": "prefer",
              "connect_timeout": 10,
              "passfile": "/pgadmin-pgpass-file"
            }
          }
        }
      }

  pgadmin-pgpass-file:
    content: |
      db:5432:*:sld:sldpass
      test-db:5432:*:sld:sldpass
      auth-db:5432:*:authentik:authentik_pass


volumes:
  authentik_db:
  db:
  test-db:
