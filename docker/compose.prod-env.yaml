# docker compose file to be used in the production environment
#
# This relies on the existence of a suitable env file where the variables referenced throughout
# are defined

name: seis-lab-data

x-common-image: &common-image "${IMAGE_URL}"

x-auth-image: &auth-image "ghcr.io/goauthentik/server:2026.8.5"
x-auth-redirect-url: &auth-redirect-url "https://seis-lab-data.ipma.pt/oauth2/callback"

x-common-env: &common-env
  SEIS_LAB_DATA__AUTH_ADMIN_TOKEN: ${AUTH_AUTHENTIK_BOOTSTRAP_TOKEN?not_set}
  SEIS_LAB_DATA__DEBUG: ${DEBUG:-false}
  SEIS_LAB_DATA__LOG_CONFIG_FILE: ${LOG_CONFIG_FILE:-/home/ubuntu/app/prod-log-config.yml}
  SEIS_LAB_DATA__MESSAGE_BROKER_DSN: redis://message-broker:6379
  SEIS_LAB_DATA__READONLY_ARCHIVE_ROOT_DIRECTORY: /data/archive

x-common-secrets: &common-secrets
  secrets:
    - source: sld-database-dsn
      target: SEIS_LAB_DATA__database_dsn
    - source: auth-client-id
      target: SEIS_LAB_DATA__auth_client_id
    - source: auth-client-secret
      target: SEIS_LAB_DATA__auth_client_secret

x-common-auth-env: &common-auth-env
  AUTHENTIK_EMAIL__HOST: smtp.postmarkapp.com
  AUTHENTIK_EMAIL__PORT: 587
  AUTHENTIK_EMAIL__USERNAME: file:///run/secrets/auth-email-username
  AUTHENTIK_EMAIL__PASSWORD: file:///run/secrets/auth-email-password
  AUTHENTIK_EMAIL__USE_TLS: true
  AUTHENTIK_EMAIL__TIMEOUT: 10
  AUTHENTIK_EMAIL__FROM: auth@seis-lab-data.naturalgis.pt
  AUTHENTIK_LOG_LEVEL: warning
  AUTHENTIK_SECRET_KEY: file:///run/secrets/auth-secret-key
  AUTHENTIK_REDIS__HOST: message-broker
  AUTHENTIK_POSTGRESQL__HOST: auth-db
  AUTHENTIK_POSTGRESQL__USER: sld_auth_user
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/auth-db-password
  SEIS_LAB_DATA_REDIRECT_URI: *auth-redirect-url
  SEIS_LAB_DATA_POST_LOGOUT_REDIRECT_URI: https://seis-lab-data.ipma.pt/
  SEIS_LAB_DATA_AUTHENTIK_BASE_URL: https://auth.seis-lab-data.ipma.pt/
  AUTHENTIK_WEB__BASE_URL: https://auth.seis-lab-data.ipma.pt

x-common-volumes: &common-volumes
  - type: bind
    source: /mnt/seislab_data
    target: /data/archive
  - type: bind
    source: /mnt/seislab_swap
    target: /data/sld-data


services:

  web-gateway:
    image: traefik:v3
    ports:
      - target: 80
        published: 80
      - target: 443
        published: 443
    configs:
      - source: traefik-conf
        target: /traefik.toml
      - source: traefik-tls-conf
        target: /tls-config.toml
    command: --configFile /traefik.toml
    restart: unless-stopped
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: /opt/seis-lab-data/certs
        target: /certs
        read_only: true
      - type: bind
        source: /opt/seis-lab-data/keys
        target: /keys
        read_only: true

  auth-db:
    image: postgres:17
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: sld_auth_user
      POSTGRES_PASSWORD_FILE: /run/secrets/auth-db-password
    restart: unless-stopped
    healthcheck:
      test: "pg_isready -d authentik -U sld_auth_user"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - authentik_db:/var/lib/postgresql/data
    secrets:
      - auth-db-password

  auth-webapp:
    image: *auth-image
    command: server
    environment:
      <<: *common-auth-env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-router.rule=Host(`auth.seis-lab-data.ipma.pt`)"
      - "traefik.http.routers.auth-router.entrypoints=websecure"
      - "traefik.http.routers.auth-router.tls=true"
      - "traefik.http.routers.auth-router.priority=100"
      - "traefik.http.services.auth-service.loadbalancer.server.port=9000"
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    secrets:
      - auth-db-password
      - auth-secret-key
      - auth-email-username
      - auth-email-password
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:9000/-/health/ready/\").raise_for_status()'"]
      start_period: 30s
      interval: 10s
      retries: 10
      timeout: 5s

  auth-worker:
    image: *auth-image
    command: worker
    # note: the AUTHENTIK_BOOTSTRAP_ variables are set from the env because
    # authentik does not support getting them via secret files, as per:
    #
    # https://github.com/goauthentik/authentik/issues/11023#issuecomment-3764472857
    environment:
      <<: *common-auth-env
      # run blueprint applies one at a time - with concurrent worker threads, the
      # blueprints applied on first boot can deadlock each other in the DB and authentik
      # does not retry them, leaving the seis-lab-data application missing
      AUTHENTIK_WORKER__THREADS: 1
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTH_AUTHENTIK_BOOTSTRAP_PASSWORD?not_set}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTH_AUTHENTIK_BOOTSTRAP_TOKEN?not_set}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTH_AUTHENTIK_BOOTSTRAP_EMAIL?not_set}
      DOZZLE_BASE_URL: https://seis-lab-data.ipma.pt/monitoring
    volumes:
      - type: bind
        source: ./sld-auth-blueprint-prod-env.yaml
        target: /blueprints/custom/sld-auth-blueprint-prod-env.yaml
        read_only: true
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    secrets:
      - auth-db-password
      - auth-secret-key
      - auth-email-username
      - auth-email-password
      - auth-client-id
      - auth-client-secret
    healthcheck:
      # Hits the unauthenticated OIDC discovery endpoint for our application. It only
      # starts returning 200 once the custom blueprint (which creates the seis-lab-data
      # OAuth2 provider/application) has actually been applied by the worker - unlike
      # checking for the akadmin user, which exists long before the custom blueprint runs.
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://auth-webapp:9000/application/o/seis-lab-data/.well-known/openid-configuration\").raise_for_status()'"]
      start_period: 30s
      interval: 10s
      retries: 15
      timeout: 5s

  message-broker:
    image: redis:8
    restart: unless-stopped
    healthcheck:
      test: "redis-cli PING | grep PONG"

  db:
    image: postgis/postgis:17-3.5
    # the default of 100 is below the sum of the connection pools of the webapp,
    # the workers and martin; see the admin guide for how this is sized
    command: postgres -c max_connections=200
    environment:
      POSTGRES_DB: seis_lab_data
      POSTGRES_USER: sld
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    restart: unless-stopped
    healthcheck:
      test: "pg_isready -d seis_lab_data -U sld"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    secrets:
      - db-password
    volumes:
      - db:/var/lib/postgresql/data

  webapp:
    image: *common-image
    environment:
      <<: *common-env
      SEIS_LAB_DATA__BIND_HOST: 0.0.0.0
      SEIS_LAB_DATA__BIND_PORT: 5000
      SEIS_LAB_DATA__PUBLIC_URL: https://seis-lab-data.ipma.pt
      SEIS_LAB_DATA__DOCS_URL: https://seis-lab-data.ipma.pt/docs
      SEIS_LAB_DATA__AUTH_EXTERNAL_BASE_URL: https://auth.seis-lab-data.ipma.pt
      SEIS_LAB_DATA__AUTH_INTERNAL_BASE_URL: http://auth-webapp:9000
      SEIS_LAB_DATA__WEBMAP_BASE_TILE_LAYER_URL: https://seis-lab-data.ipma.pt/tiles/emodnet-bathymetry/{z}/{x}/{y}
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.sld-service.loadbalancer.server.port=5000"
      - "traefik.http.routers.sld-router.rule=Host(`seis-lab-data.ipma.pt`)"
      - "traefik.http.routers.sld-router.entrypoints=websecure"
      - "traefik.http.routers.sld-router.tls=true"
      - "traefik.http.routers.sld-router.priority=10"
      - "traefik.http.routers.sld-router.service=sld-service"
    volumes:
      *common-volumes
    <<: *common-secrets
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      auth-webapp:
        condition: service_healthy
      auth-worker:
        condition: service_healthy

  interactive-worker:
    image: *common-image
    command:
      - "run-worker"
      # tasks of this worker are short database operations, so few processes suffice
      - "--processes"
      - "${INTERACTIVE_WORKER_PROCESSES:-2}"
      - "--threads"
      - "${INTERACTIVE_WORKER_THREADS:-8}"
      - "--queue"
      - "default"
    environment:
      <<: *common-env
    volumes:
      *common-volumes
    <<: *common-secrets
    restart: unless-stopped

  long-tasks-worker:
    image: *common-image
    command:
      - "run-worker"
      # each thread may hold a GDAL render or an export, so they are capped to
      # keep memory and database connections in check
      - "--processes"
      - "${LONG_TASKS_WORKER_PROCESSES:-2}"
      - "--threads"
      - "${LONG_TASKS_WORKER_THREADS:-4}"
      - "--queue"
      - "previews"
      - "--queue"
      - "thumbnails"
      - "--queue"
      - "exports"
    environment:
      <<: *common-env
      SEIS_LAB_DATA__THUMBNAIL_BASE_TILE_LAYER_URL: http://martin-tile-server:3000/emodnet-bathymetry/{z}/{x}/{y}
    volumes:
      *common-volumes
    <<: *common-secrets
    restart: unless-stopped

  discovery-worker:
    image: *common-image
    command:
      - "run-worker"
      # one process discovers one mission at a time, using about one CPU core;
      # a single thread per process keeps two discoveries from sharing that core
      - "--processes"
      - "${DISCOVERY_WORKER_PROCESSES:-3}"
      - "--threads"
      - "1"
      - "--queue"
      - "discovery"
    environment:
      <<: *common-env
      SEIS_LAB_DATA__DISCOVERY_EXTRACTION_CONCURRENCY: ${DISCOVERY_EXTRACTION_CONCURRENCY:-4}
      SEIS_LAB_DATA__DISCOVERY_TIME_LIMIT_HOURS: ${DISCOVERY_TIME_LIMIT_HOURS:-24}
    volumes:
      *common-volumes
    <<: *common-secrets
    restart: unless-stopped

  martin-tile-server:
    image: ghcr.io/maplibre/martin:martin-v0.19.3
    command: ["--config", "/run/secrets/martin-config"]
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - martin-config
    volumes:
      - type: bind
        source: /mnt/seislab_swap/pmtiles
        target: /pmtiles
        read_only: true
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.martin-stripprefix.stripprefix.prefixes=/tiles"
      - "traefik.http.routers.martin-router.entrypoints=websecure"
      - "traefik.http.routers.martin-router.tls=true"
      - "traefik.http.routers.martin-router.rule=Host(`seis-lab-data.ipma.pt`) && PathPrefix(`/tiles`)"
      - "traefik.http.routers.martin-router.priority=90"
      - "traefik.http.routers.martin-router.middlewares=martin-stripprefix"
      - "traefik.http.services.martin.loadbalancer.server.port=3000"

  dozzle:
    image: amir20/dozzle:v10
    environment:
      DOZZLE_BASE: /monitoring
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: X-authentik-username
      DOZZLE_AUTH_HEADER_EMAIL: X-authentik-email
      DOZZLE_AUTH_HEADER_NAME: X-authentik-name
      DOZZLE_AUTH_LOGOUT_URL: https://auth.seis-lab-data.ipma.pt/if/flow/default-invalidation-flow/
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.authentik-auth.forwardauth.address=http://auth-webapp:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authentik-auth.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
      - "traefik.http.middlewares.authentik-auth.forwardauth.maxBodySize=1048576"
      - "traefik.http.routers.dozzle-router.rule=Host(`seis-lab-data.ipma.pt`) && PathPrefix(`/monitoring`)"
      - "traefik.http.routers.dozzle-router.entrypoints=websecure"
      - "traefik.http.routers.dozzle-router.tls=true"
      - "traefik.http.routers.dozzle-router.priority=95"
      - "traefik.http.routers.dozzle-router.middlewares=authentik-auth"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

  docs:
    image: *common-image
    entrypoint: ["uv", "run", "python", "/home/ubuntu/app/docker/docs/entrypoint.py"]
    environment:
      MKDOCS_SITE_URL: "https://seis-lab-data.ipma.pt/docs"
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.docs-add-trailing-slash.redirectregex.regex=^(https?://[^/]+/docs)$$"
      - "traefik.http.middlewares.docs-add-trailing-slash.redirectregex.replacement=$${1}/"
      - "traefik.http.middlewares.docs-add-trailing-slash.redirectregex.permanent=true"
      - "traefik.http.middlewares.docs-stripprefix.stripprefix.prefixes=/docs"
      - "traefik.http.routers.docs-router.rule=Host(`seis-lab-data.ipma.pt`) && PathPrefix(`/docs`)"
      - "traefik.http.routers.docs-router.entrypoints=websecure"
      - "traefik.http.routers.docs-router.tls=true"
      - "traefik.http.routers.docs-router.priority=90"
      - "traefik.http.routers.docs-router.middlewares=docs-add-trailing-slash,docs-stripprefix"
      - "traefik.http.services.docs.loadbalancer.server.port=8000"

configs:
  traefik-conf:
    file: traefik-prod-config.toml
  traefik-tls-conf:
    file: traefik-tls-config.toml

volumes:
  authentik_db:
  db:

secrets:
  auth-client-id:
    file: /opt/seis-lab-data/secrets/auth-client-id.txt
  auth-client-secret:
    file: /opt/seis-lab-data/secrets/auth-client-secret.txt
  auth-db-password:
    file: /opt/seis-lab-data/secrets/auth-db-password.txt
  auth-email-password:
    file: /opt/seis-lab-data/secrets/auth-email-password.txt
  auth-email-username:
    file: /opt/seis-lab-data/secrets/auth-email-username.txt
  auth-secret-key:
    file: /opt/seis-lab-data/secrets/auth-secret-key.txt
  db-password:
    file: /opt/seis-lab-data/secrets/db-password.txt
  martin-config:
    file: /opt/seis-lab-data/secrets/martin-config.yaml
  sld-database-dsn:
    file: /opt/seis-lab-data/secrets/sld-db-dsn.txt
